    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};

      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);

      const s = document.createElement('script');

      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {

    }

    setStatus('Error unpacking: ' + err.message);

", category: \"Convenience\" },\n    ],\n    IT: [\n      { name: \"Carob Snack\", category: \"Snacks\" },\n      { name: \"ForHER Functional Drink\", category: \"Functional\" },\n      { name: \"FOOD PAKKY\", category: \"Packaging\" },\n    ],\n    LV: [\n      { name: \"Pea-based Curd Cheese\", category: \"Convenience\" },\n      { name: \"Vegetable Paste with Spirulina\", category: \"Convenience\" },\n      { name: \"Fresh Spirulina with Nordic Lemon Syrup\", category: \"Functional\" },\n    ],\n    RO: [\n      { name: \"Spent Grains Baguette\", category: \"Bakery\" },\n      { name: \"Chicken Frankfurters\", category: \"Meat\" },\n      { name: \"Pork Ham Gourmeticus\", category: \"Meat\" },\n    ],\n    HU: [\n      { name: \"Sweet Potato Bread\", category: \"Bakery\" },\n      { name: \"Vegan Dessert Cup\", category: \"Snacks\" },\n    ],\n    CZ: [\n      { name: \"Smooth Almond Porridge\", category: \"Breakfast\" },\n      { name: \"Liposomal Vitamin & Herbal Complex\", category: \"Functional\" },\n    ],\n    LT: [\n      { name: \"Grikola – Buckwheat Granola\", category: \"Breakfast\" },\n      { name: \"Full Meal TRIO\", category: \"Packaging\" },\n    ],\n    SK: [\n      { name: \"Breakfast Mash for Older Adults\", category: \"Breakfast\" },\n      { name: \"Wrap Falafel\", category: \"Convenience\" },\n    ],\n    BG: [\n      { name: \"Jerusalem Artichoke Purée\", category: \"Convenience\" },\n      { name: \"Modupack\", category: \"Packaging\" },\n    ],\n    PT: [{ name: \"Digestive Biscuits Equilíbrio\", category: \"Snacks\" }],\n    EE: [{ name: \"Curd Dessert\", category: \"Dairy\" }],\n    TR: [{ name: \"İçim Probiotic Yoghurt Drinks ×3\", category: \"Dairy\" }],\n    HR: [{ name: \"Kombuchaga Extract with Coffee\", category: \"Functional\" }],\n  };\n\n  // ---------- SETUP ----------\n  const STAGE_W = 680;\n  const STAGE_H = 620;\n\n  const canvas = document.getElementById(\"net\");\n  const ctx = canvas.getContext(\"2d\");\n\n  function resize() {\n    const rect = canvas.getBoundingClientRect();\n    const dpr = window.devicePixelRatio || 1;\n    canvas.width = rect.width * dpr;\n    canvas.height = rect.height * dpr;\n    // scale so we draw in 680x620 logical units, regardless of CSS size\n    const sx = canvas.width / STAGE_W;\n    const sy = canvas.height / STAGE_H;\n    ctx.setTransform(sx, 0, 0, sy, 0, 0);\n  }\n\n  // ---------- LAYOUT ----------\n  const PADDING_TOP = 56;       // room for column headers\n  const PADDING_BOTTOM = 92;    // room for legend\n  // Country column: label on far left, node on the inner side (closer to label)\n  const COUNTRY_LABEL_LEFT = 28;        // flag/name start\n  const COUNTRY_X = 178;                // node center x — close to label end\n  // Category column: node on inner side, label on far right (close to dot)\n  const CATEGORY_X = STAGE_W - 178;\n  const CATEGORY_LABEL_RIGHT = STAGE_W - 28;\n  const NODE_R_COUNTRY = 5;\n  const NODE_R_CATEGORY = 6;\n\n  const countryNodes = [];\n  {\n    const n = countries.length;\n    const top = PADDING_TOP + 8;\n    const bot = STAGE_H - PADDING_BOTTOM - 8;\n    const step = (bot - top) / (n - 1);\n    countries.forEach((c, i) => {\n      countryNodes.push({\n        ...c,\n        x: COUNTRY_X,\n        y: top + i * step,\n        empty: c.cats.length === 0,\n      });\n    });\n  }\n\n  const categoryNodes = [];\n  {\n    const n = categories.length;\n    const top = PADDING_TOP + 30;\n    const bot = STAGE_H - PADDING_BOTTOM - 30;\n    const step = (bot - top) / (n - 1);\n    categories.forEach((c, i) => {\n      categoryNodes.push({\n        ...c,\n        x: CATEGORY_X,\n        y: top + i * step,\n        revealAt: i * 2000, // 2s apart\n      });\n    });\n  }\n\n  const catById = Object.fromEntries(categoryNodes.map(c => [c.id, c]));\n\n  // Build links\n  const links = [];\n  countryNodes.forEach(cn => {\n    cn.cats.forEach(catId => {\n      const cat = catById[catId];\n      if (!cat) return;\n      links.push({\n        country: cn,\n        cat,\n        // each link \"lights up\" when its category reveals, with small per-link stagger\n        lightAt: cat.revealAt + 100 + Math.random() * 600,\n      });\n    });\n  });\n\n  // Pulses: tiny lights running along links after animation phase\n  const pulses = []; // { link, t (0..1), speed, life }\n  const TOTAL_REVEAL_MS = (categoryNodes.length - 1) * 2000 + 1200;\n\n  // ---------- DRAW HELPERS ----------\n  function bezier(p0, p1, p2, p3, t) {\n    const u = 1 - t;\n    const x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;\n    const y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;\n    return { x, y };\n  }\n\n  function linkPoints(link) {\n    const a = link.country;\n    const b = link.cat;\n    const ax = a.x + 7;            // start just outside node (inner side)\n    const bx = b.x - 7;\n    const dx = bx - ax;\n    const cp1 = { x: ax + dx * 0.55, y: a.y };\n    const cp2 = { x: ax + dx * 0.45, y: b.y };\n    return {\n      p0: { x: ax, y: a.y },\n      p1: cp1,\n      p2: cp2,\n      p3: { x: bx, y: b.y },\n    };\n  }\n\n  function isDark() {\n    return document.documentElement.dataset.theme === \"dark\";\n  }\n\n  function drawLink(link, lit, intensity, dim) {\n    const { p0, p1, p2, p3 } = linkPoints(link);\n    const dimMul = dim ? 0.12 : 1;\n    const focusMul = (hoverState.kind && !dim) ? 1.3 : 1;\n    ctx.beginPath();\n    ctx.moveTo(p0.x, p0.y);\n    ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);\n    if (lit) {\n      ctx.strokeStyle = withAlpha(link.cat.color, 0.55 * intensity * dimMul * focusMul);\n      ctx.lineWidth = 1.2 * (dim ? 1 : 1) * (focusMul > 1 ? 1.4 : 1);\n      ctx.shadowColor = withAlpha(link.cat.color, 0.6 * intensity * dimMul);\n      ctx.shadowBlur = dim ? 0 : 6;\n      ctx.stroke();\n      ctx.shadowBlur = 0;\n      // brighter core\n      ctx.beginPath();\n      ctx.moveTo(p0.x, p0.y);\n      ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);\n      ctx.strokeStyle = withAlpha(link.cat.color, 0.95 * intensity * dimMul * focusMul);\n      ctx.lineWidth = 0.7 * (focusMul > 1 ? 1.5 : 1);\n      ctx.stroke();\n    } else {\n      ctx.strokeStyle = isDark() ? \"rgba(255,255,255,0.05)\" : \"rgba(0,0,0,0.05)\";\n      ctx.lineWidth = 0.8;\n      ctx.stroke();\n    }\n  }\n\n  function withAlpha(hex, a) {\n    // hex like #RRGGBB\n    const h = hex.replace(\"#\", \"\");\n    const r = parseInt(h.slice(0, 2), 16);\n    const g = parseInt(h.slice(2, 4), 16);\n    const b = parseInt(h.slice(4, 6), 16);\n    return `rgba(${r}, ${g}, ${b}, ${a})`;\n  }\n\n  function drawCountryNode(cn, dim) {\n    const ink = isDark() ? \"#f3f4f6\" : \"#1a1a1a\";\n    const muted = isDark() ? \"#6b7080\" : \"#a8a8a8\";\n    const alpha = dim ? 0.35 : 1;\n    ctx.globalAlpha = alpha;\n\n    // Node circle (inner side)\n    if (cn.empty) {\n      // Pulsing opacity for empty countries\n      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.0028 + cn.y * 0.05);\n      ctx.globalAlpha = alpha * (0.45 + pulse * 0.45);\n      ctx.beginPath();\n      ctx.arc(cn.x, cn.y, NODE_R_COUNTRY - 0.5, 0, Math.PI * 2);\n      ctx.setLineDash([2, 2]);\n      ctx.strokeStyle = muted;\n      ctx.lineWidth = 1.1;\n      ctx.fillStyle = \"transparent\";\n      ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.globalAlpha = alpha;\n    } else {\n      ctx.beginPath();\n      ctx.arc(cn.x, cn.y, NODE_R_COUNTRY - 0.5, 0, Math.PI * 2);\n      ctx.fillStyle = ink;\n      ctx.fill();\n    }\n\n    // Flag + name (left aligned, on outer side)\n    const baseColor = cn.empty ? muted : ink;\n    ctx.fillStyle = baseColor;\n    ctx.textBaseline = \"middle\";\n    ctx.textAlign = \"left\";\n    ctx.font = \"13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n    ctx.fillText(cn.flag, COUNTRY_LABEL_LEFT, cn.y);\n\n    ctx.font = `${cn.empty ? 400 : 500} 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;\n    ctx.fillText(cn.name, COUNTRY_LABEL_LEFT + 24, cn.y);\n    ctx.globalAlpha = 1;\n  }\n\n  function drawCategoryNode(cat, revealProgress, dim, focused) {\n    if (revealProgress <= 0) return;\n    const ink = isDark() ? \"#f3f4f6\" : \"#1a1a1a\";\n    const ease = easeOutCubic(Math.min(1, revealProgress));\n    const baseAlpha = dim ? 0.3 : 1;\n\n    // Pulsing ring (entry)\n    if (revealProgress < 1.6) {\n      ctx.globalAlpha = baseAlpha;\n      ctx.beginPath();\n      ctx.arc(cat.x, cat.y, 7 + (1 - Math.min(1, revealProgress)) * 14, 0, Math.PI * 2);\n      ctx.strokeStyle = withAlpha(cat.color, 0.4 * (1 - Math.min(1, revealProgress)));\n      ctx.lineWidth = 2;\n      ctx.stroke();\n    }\n    // Focus ring when hovered\n    if (focused) {\n      ctx.globalAlpha = 1;\n      const r = NODE_R_CATEGORY + 4 + Math.sin(performance.now() * 0.006) * 1.5;\n      ctx.beginPath();\n      ctx.arc(cat.x, cat.y, r, 0, Math.PI * 2);\n      ctx.strokeStyle = withAlpha(cat.color, 0.5);\n      ctx.lineWidth = 1.5;\n      ctx.stroke();\n    }\n\n    // Node circle\n    ctx.globalAlpha = baseAlpha;\n    const nr = (focused ? NODE_R_CATEGORY + 1 : NODE_R_CATEGORY) * ease;\n    ctx.beginPath();\n    ctx.arc(cat.x, cat.y, nr, 0, Math.PI * 2);\n    ctx.fillStyle = cat.color;\n    ctx.shadowColor = withAlpha(cat.color, 0.6);\n    ctx.shadowBlur = dim ? 0 : 8;\n    ctx.fill();\n    ctx.shadowBlur = 0;\n\n    // Label (right-aligned, on outer side)\n    ctx.globalAlpha = ease * baseAlpha;\n    ctx.fillStyle = ink;\n    ctx.textBaseline = \"middle\";\n    ctx.textAlign = \"right\";\n    ctx.font = \"600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n    ctx.fillText(cat.label, CATEGORY_LABEL_RIGHT, cat.y - 7);\n\n    ctx.fillStyle = isDark() ? \"#9aa0ad\" : \"#7a7a7a\";\n    ctx.font = \"11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n    ctx.fillText(`${cat.products} products`, CATEGORY_LABEL_RIGHT, cat.y + 7);\n    ctx.globalAlpha = 1;\n  }\n\n  function drawPulse(p) {\n    const pts = linkPoints(p.link);\n    const pos = bezier(pts.p0, pts.p1, pts.p2, pts.p3, p.t);\n    const color = p.link.cat.color;\n    // Trail (longer, fading)\n    for (let i = 6; i >= 1; i--) {\n      const tt = Math.max(0, p.t - i * 0.028);\n      const tp = bezier(pts.p0, pts.p1, pts.p2, pts.p3, tt);\n      ctx.beginPath();\n      ctx.arc(tp.x, tp.y, 2.2 - i * 0.18, 0, Math.PI * 2);\n      ctx.fillStyle = withAlpha(color, 0.08 * (7 - i));\n      ctx.fill();\n    }\n    // Outer glow\n    ctx.beginPath();\n    ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);\n    ctx.fillStyle = withAlpha(color, 0.2);\n    ctx.fill();\n    // Head\n    ctx.beginPath();\n    ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);\n    ctx.shadowColor = color;\n    ctx.shadowBlur = 14;\n    ctx.fillStyle = \"#ffffff\";\n    ctx.fill();\n    ctx.shadowBlur = 0;\n    // Colored core\n    ctx.beginPath();\n    ctx.arc(pos.x, pos.y, 2.6, 0, Math.PI * 2);\n    ctx.fillStyle = color;\n    ctx.fill();\n  }\n\n  function drawHeaders() {\n    const ink = isDark() ? \"#f3f4f6\" : \"#1a1a1a\";\n    const muted = isDark() ? \"#9aa0ad\" : \"#7a7a7a\";\n    const y = 30;\n\n    // \"COUNTRIES\" header — left column (offset right to avoid Replay button)\n    const countriesX = COUNTRY_LABEL_LEFT + 92;\n    ctx.fillStyle = muted;\n    ctx.textBaseline = \"middle\";\n    ctx.textAlign = \"left\";\n    ctx.font = \"600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n    ctx.fillText(\"COUNTRIES\", countriesX, y);\n\n    // small accent line under header\n    ctx.beginPath();\n    ctx.moveTo(countriesX, y + 10);\n    ctx.lineTo(countriesX + 28, y + 10);\n    ctx.strokeStyle = ink;\n    ctx.lineWidth = 1.5;\n    ctx.stroke();\n\n    // \"CATEGORIES\" header — right column (offset left to avoid theme toggle)\n    const categoriesX = CATEGORY_LABEL_RIGHT - 56;\n    ctx.textAlign = \"right\";\n    ctx.fillStyle = muted;\n    ctx.fillText(\"CATEGORIES\", categoriesX, y);\n\n    ctx.beginPath();\n    ctx.moveTo(categoriesX - 28, y + 10);\n    ctx.lineTo(categoriesX, y + 10);\n    ctx.stroke();\n  }\n\n  function drawLegend(elapsed) {\n    const y0 = STAGE_H - PADDING_BOTTOM + 22;\n    const ink = isDark() ? \"#f3f4f6\" : \"#1a1a1a\";\n    const muted = isDark() ? \"#9aa0ad\" : \"#7a7a7a\";\n\n    // Alphabetical order in the legend\n    const cats = [...categoryNodes].sort((a, b) => a.label.localeCompare(b.label));\n    const padX = 28;\n    const colGap = 8;\n    const itemH = 20;\n    const cols = 4;\n    const rows = 2;\n    const colW = (STAGE_W - padX * 2 - colGap * (cols - 1)) / cols;\n\n    cats.forEach((cat, i) => {\n      const col = i % cols;\n      const row = Math.floor(i / cols);\n      const x = padX + col * (colW + colGap);\n      const y = y0 + row * itemH;\n\n      const reveal = Math.max(0, Math.min(1, (elapsed - cat.revealAt) / 500));\n      ctx.globalAlpha = reveal;\n\n      // dot\n      ctx.beginPath();\n      ctx.arc(x + 5, y, 4, 0, Math.PI * 2);\n      ctx.fillStyle = cat.color;\n      ctx.fill();\n\n      // label\n      ctx.fillStyle = ink;\n      ctx.textBaseline = \"middle\";\n      ctx.textAlign = \"left\";\n      ctx.font = \"500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n      ctx.fillText(cat.label, x + 14, y - 0.5);\n\n      // products count\n      ctx.fillStyle = muted;\n      ctx.font = \"11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\n      const labelW = ctx.measureText(cat.label).width;\n      ctx.fillText(`· ${cat.products}`, x + 14 + labelW + 4, y - 0.5);\n\n      ctx.globalAlpha = 1;\n    });\n  }\n\n  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }\n\n  // ---------- ANIMATION ----------\n  let startTime = null;\n\n  function spawnPulse() {\n    // Pick a random link\n    if (links.length === 0) return;\n    const link = links[Math.floor(Math.random() * links.length)];\n    pulses.push({\n      link,\n      t: 0,\n      speed: 0.4 + Math.random() * 0.5, // travels in 1.4-2.0s\n    });\n  }\n\n  let lastPulseSpawn = 0;\n\n  function frame(now) {\n    if (!startTime) startTime = now;\n    const elapsed = now - startTime;\n    const dt = Math.min(50, now - (frame._last || now)) / 1000;\n    frame._last = now;\n\n    // background — let CSS surface show through; clear with surface tinted bg if needed\n    ctx.clearRect(0, 0, STAGE_W, STAGE_H);\n\n    // Compute focus sets based on hover\n    const focusedLinks = new Set();\n    const focusedCountries = new Set();\n    const focusedCategories = new Set();\n    if (hoverState.kind === \"country\") {\n      const cn = hoverState.target;\n      focusedCountries.add(cn);\n      links.forEach(l => {\n        if (l.country === cn) {\n          focusedLinks.add(l);\n          focusedCategories.add(l.cat);\n        }\n      });\n    } else if (hoverState.kind === \"category\") {\n      const cat = hoverState.target;\n      focusedCategories.add(cat);\n      links.forEach(l => {\n        if (l.cat === cat) {\n          focusedLinks.add(l);\n          focusedCountries.add(l.country);\n        }\n      });\n    }\n    const hasHover = hoverState.kind != null;\n\n    // 1) Links — draw dimmed first, focused on top\n    const drawOrder = links.slice().sort((a, b) => {\n      const af = focusedLinks.has(a) ? 1 : 0;\n      const bf = focusedLinks.has(b) ? 1 : 0;\n      return af - bf;\n    });\n    drawOrder.forEach(l => {\n      const lightStart = l.lightAt;\n      const since = elapsed - lightStart;\n      const dim = hasHover && !focusedLinks.has(l);\n      if (since < 0) {\n        drawLink(l, false, 0, dim);\n      } else {\n        const intensity = Math.min(1, since / 600);\n        drawLink(l, true, intensity, dim);\n      }\n    });\n\n    // 2) Country nodes\n    countryNodes.forEach(cn => {\n      const dim = hasHover && !focusedCountries.has(cn);\n      drawCountryNode(cn, dim);\n    });\n\n    // 3) Category nodes (reveal sequentially)\n    categoryNodes.forEach(cat => {\n      const since = elapsed - cat.revealAt;\n      const progress = since / 400; // 400ms to fully appear\n      const dim = hasHover && !focusedCategories.has(cat);\n      const focused = focusedCategories.has(cat) && hasHover;\n      drawCategoryNode(cat, progress, dim, focused);\n    });\n\n    // 4) Pulses — start spawning after all categories revealed\n    if (elapsed > TOTAL_REVEAL_MS) {\n      if (now - lastPulseSpawn > 180) {\n        if (Math.random() < 0.7) spawnPulse();\n        lastPulseSpawn = now;\n      }\n      // also occasionally spawn a burst\n      if (Math.random() < 0.005) spawnPulse();\n    } else {\n      // gentle pulses on already-lit links during reveal\n      categoryNodes.forEach(cat => {\n        if (elapsed > cat.revealAt + 300 && Math.random() < 0.04) {\n          const linkSet = links.filter(l => l.cat === cat);\n          if (linkSet.length) {\n            pulses.push({\n              link: linkSet[Math.floor(Math.random() * linkSet.length)],\n              t: 0,\n              speed: 0.5 + Math.random() * 0.4,\n            });\n          }\n        }\n      });\n    }\n\n    // advance + draw pulses\n    for (let i = pulses.length - 1; i >= 0; i--) {\n      const p = pulses[i];\n      p.t += p.speed * dt;\n      if (p.t >= 1) {\n        pulses.splice(i, 1);\n        continue;\n      }\n      drawPulse(p);\n    }\n\n    // 5) Legend\n    drawHeaders();\n    drawLegend(elapsed);\n\n    requestAnimationFrame(frame);\n  }\n\n  // ---------- THEME ----------\n  function setTheme(theme) {\n    document.documentElement.dataset.theme = theme;\n    localStorage.setItem(\"netviz_theme\", theme);\n  }\n  const saved = localStorage.getItem(\"netviz_theme\");\n  if (saved) setTheme(saved);\n  else if (window.matchMedia && window.matchMedia(\"(prefers-color-scheme: dark)\").matches) setTheme(\"dark\");\n\n  document.getElementById(\"themeToggle\").addEventListener(\"click\", () => {\n    setTheme(isDark() ? \"light\" : \"dark\");\n  });\n\n  document.getElementById(\"replay\").addEventListener(\"click\", () => {\n    startTime = null;\n    pulses.length = 0;\n    // re-randomize lightAt slightly per replay for organic feel\n    links.forEach(l => {\n      l.lightAt = l.cat.revealAt + 100 + Math.random() * 600;\n    });\n  });\n\n  // ---------- HOVER + TOOLTIP ----------\n  const tooltip = document.getElementById(\"tooltip\");\n  const stageEl = document.querySelector(\".stage\");\n  const hoverState = { kind: null, target: null };\n\n  function escapeHtml(s) {\n    return String(s).replace(/[&<>\"']/g, c => ({\n      \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\"\n    }[c]));\n  }\n\n  function getCanvasScale() {\n    const rect = canvas.getBoundingClientRect();\n    return { sx: rect.width / STAGE_W, sy: rect.height / STAGE_H, rect };\n  }\n\n  function pickNode(mouseX, mouseY) {\n    // mouseX/Y are in stage logical coords (0..STAGE_W, 0..STAGE_H)\n    // Country pickable region: from label start through node\n    const countryHitRight = COUNTRY_X + 10;\n    const countryHitLeft = COUNTRY_LABEL_LEFT - 4;\n    if (mouseX >= countryHitLeft && mouseX <= countryHitRight) {\n      // find nearest by y\n      let best = null, bestD = Infinity;\n      countryNodes.forEach(cn => {\n        const d = Math.abs(cn.y - mouseY);\n        if (d < bestD) { bestD = d; best = cn; }\n      });\n      if (best && bestD < 12) return { kind: \"country\", target: best };\n    }\n    // Category pickable region\n    const categoryHitLeft = CATEGORY_X - 10;\n    const categoryHitRight = CATEGORY_LABEL_RIGHT + 4;\n    if (mouseX >= categoryHitLeft && mouseX <= categoryHitRight) {\n      let best = null, bestD = Infinity;\n      categoryNodes.forEach(cat => {\n        const d = Math.abs(cat.y - mouseY);\n        if (d < bestD) { bestD = d; best = cat; }\n      });\n      if (best && bestD < 14) return { kind: \"category\", target: best };\n    }\n    return null;\n  }\n\n  const catColorOf = id => (categoryNodes.find(c => c.id === id) || {}).color || \"#888\";\n\n  function buildCountryTooltip(cn) {\n    const list = productsByCountry[cn.code] || [];\n    if (cn.empty) {\n      return `\n        <div class=\"tt-head\">\n          <span style=\"font-size:14px\">${cn.flag}<\u002Fspan>\n          <span>${escapeHtml(cn.name)}<\u002Fspan>\n          <span class=\"tt-count\">CEL participant<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tt-empty\">No products yet<\u002Fdiv>\n      `;\n    }\n    const items = list.map(p => {\n      const color = catColorOf(p.category);\n      return `<li>\n        <span class=\"tt-name\">${escapeHtml(p.name)}<\u002Fspan>\n        <span class=\"tt-pill\" style=\"background:${color}\">${escapeHtml(p.category)}<\u002Fspan>\n      <\u002Fli>`;\n    }).join(\"\");\n    return `\n      <div class=\"tt-head\">\n        <span style=\"font-size:14px\">${cn.flag}<\u002Fspan>\n        <span>${escapeHtml(cn.name)}<\u002Fspan>\n        <span class=\"tt-count\">${list.length} product${list.length === 1 ? \"\" : \"s\"}<\u002Fspan>\n      <\u002Fdiv>\n      <ul>${items}<\u002Ful>\n    `;\n  }\n\n  function buildCategoryTooltip(cat) {\n    const list = productsByCategory[cat.id] || [];\n    const items = list.map(p => `\n      <li>\n        <span style=\"font-size:13px\">${p.flag}<\u002Fspan>\n        <span class=\"tt-name\">${escapeHtml(p.name)}<\u002Fspan>\n        <span class=\"tt-meta\">· ${escapeHtml(p.company)}<\u002Fspan>\n      <\u002Fli>\n    `).join(\"\");\n    return `\n      <div class=\"tt-head\">\n        <span class=\"tt-dot\" style=\"background:${cat.color}\"><\u002Fspan>\n        <span>${escapeHtml(cat.label)}<\u002Fspan>\n        <span class=\"tt-count\">${list.length} product${list.length === 1 ? \"\" : \"s\"}<\u002Fspan>\n      <\u002Fdiv>\n      <ul>${items}<\u002Ful>\n    `;\n  }\n\n  function showTooltip(html, anchorX, anchorY, scale) {\n    tooltip.innerHTML = html;\n    tooltip.classList.add(\"show\");\n    // Measure & position\n    const ttW = tooltip.offsetWidth;\n    const ttH = tooltip.offsetHeight;\n    const stageRect = stageEl.getBoundingClientRect();\n    // anchor is in stage logical coords; convert to pixel within stage\n    let px = anchorX * scale.sx;\n    let py = anchorY * scale.sy;\n    // Place above-right by default\n    let left = px + 14;\n    let top = py - ttH - 12;\n    if (left + ttW > stageRect.width - 8) left = px - ttW - 14;\n    if (left < 8) left = 8;\n    if (top < 8) top = py + 14;\n    if (top + ttH > stageRect.height - 8) top = stageRect.height - ttH - 8;\n    tooltip.style.left = left + \"px\";\n    tooltip.style.top = top + \"px\";\n  }\n\n  function hideTooltip() {\n    tooltip.classList.remove(\"show\");\n  }\n\n  function updateHover(clientX, clientY) {\n    const scale = getCanvasScale();\n    const mx = (clientX - scale.rect.left) / scale.sx;\n    const my = (clientY - scale.rect.top) / scale.sy;\n    const hit = pickNode(mx, my);\n    if (!hit) {\n      hoverState.kind = null;\n      hoverState.target = null;\n      hideTooltip();\n      stageEl.style.cursor = \"default\";\n      return;\n    }\n    hoverState.kind = hit.kind;\n    hoverState.target = hit.target;\n    stageEl.style.cursor = \"pointer\";\n    if (hit.kind === \"country\") {\n      showTooltip(buildCountryTooltip(hit.target), hit.target.x, hit.target.y, scale);\n    } else {\n      showTooltip(buildCategoryTooltip(hit.target), hit.target.x, hit.target.y, scale);\n    }\n  }\n\n  stageEl.addEventListener(\"mousemove\", e => updateHover(e.clientX, e.clientY));\n  stageEl.addEventListener(\"mouseleave\", () => {\n    hoverState.kind = null;\n    hoverState.target = null;\n    hideTooltip();\n    stageEl.style.cursor = \"default\";\n  });\n\n  // ---------- KICKOFF ----------\n  resize();\n  window.addEventListener(\"resize\", resize);\n  requestAnimationFrame(frame);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
